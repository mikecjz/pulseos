[project]
name = "mrzero-mcp"
version = "0.1.0"
description = "MCP server that simulates Pulseq sequences with MRzero-Core (PDG) for PulseOS"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mcp>=1.20,<2",
  "MRzeroCore==1.6.0",
  "numpy>=1.26",
  "torch>=2.5",
]

[project.scripts]
mrzero-mcp = "mrzero_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrzero_mcp"]

[tool.uv]
# CUDA 12.8 wheels; they run on CPU too when no GPU is visible.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
