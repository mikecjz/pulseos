# PulseOS overlay on a DSH profile. scripts/dsh.mjs passes this file as
# `--patch`; relative plugin paths resolve beside this file.

- insert:
    - id: pulseos-scanner-profile
      name: '../../packages/seq/scanner-profile/src/index.ts'
      config:
        profile: generic
    - id: pulseos-seq-service
      name: '../../packages/seq/service/src/index.ts'
    - id: pulseos-seq-tools
      name: '../../packages/seq/tools/src/index.ts'
    - id: pulseos-seq-refs
      name: '../../packages/seq/refs/src/index.ts'
