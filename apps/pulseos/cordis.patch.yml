# PulseOS overlay on a DSH profile. scripts/dsh.mjs passes this file as
# `--patch`; relative plugin paths resolve beside this file.

- insert:
    - id: pulseos-scanner-profile
      name: '../../packages/seq/scanner-profile/src/index.ts'
      config:
        profile: generic
    - id: pulseos-seq-service
      name: '../../packages/seq/service/src/index.ts'
    - id: pulseos-seq-tools
      name: '../../packages/seq/tools/src/index.ts'
    - id: pulseos-seq-refs
      name: '../../packages/seq/refs/src/index.ts'
    - id: pulseos-seq-viewer
      name: '../../packages/seq/viewer/src/index.ts'
    - id: pulseos-brand
      name: '../../packages/app/brand/src/index.ts'
    # Simulation (sims/README.md): engines are MCP servers; mrzero runs in Docker on GPU 0 by
    # default. Without Docker or a GPU, override `engines.mrzero` (launcher: local, gpu: null).
    - id: pulseos-sim-service
      name: '../../packages/sim/service/src/index.ts'
    - id: pulseos-sim-tools
      name: '../../packages/sim/tools/src/index.ts'
    - id: pulseos-sim-viewer
      name: '../../packages/sim/viewer/src/index.ts'
