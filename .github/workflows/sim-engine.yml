name: sim-engine

# The MRzero engine needs torch (several GB), so it is not part of the default CI; the TypeScript
# job tests ctx.pulseSim against the fake engine. Run this on demand or when the engine changes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sims/mrzero-mcp/**'

jobs:
  mrzero:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for torch
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: astral-sh/setup-uv@v6
        with:
          cache-dependency-glob: sims/mrzero-mcp/uv.lock
      - run: uv sync --project sims/mrzero-mcp --locked
      - name: pytest (CPU, tubes phantom, MCP over stdio)
        run: uv run --project sims/mrzero-mcp pytest sims/mrzero-mcp/tests
      - name: Docker image
        run: docker build -t pulseos/mrzero-mcp:ci sims/mrzero-mcp
