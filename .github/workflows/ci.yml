name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install DSH
        working-directory: dsh
        run: pnpm install --frozen-lockfile
      - name: Build DSH artifacts
        working-directory: dsh
        run: pnpm run build:artifacts
      - uses: astral-sh/setup-uv@v6
        with:
          # Explicit path: the default '**' globs walk dsh/**/node_modules, whose pnpm
          # workspace symlinks form cycles (ELOOP).
          cache-dependency-glob: python/uv.lock
      - name: Python environment
        run: uv sync --project python --locked
      - name: Install PulseOS
        run: pnpm install --frozen-lockfile
      - name: Build the viewer bundle
        run: pnpm run build
      - name: Chromium for the browser test
        run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test
      - name: Boot smoke
        run: pnpm run smoke:boot

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          # Explicit path: the default '**' globs walk dsh/**/node_modules, whose pnpm
          # workspace symlinks form cycles (ELOOP).
          cache-dependency-glob: python/uv.lock
      - run: uv sync --project python --locked
      - run: uv run --project python pytest python/tests
