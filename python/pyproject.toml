[project]
name = "pulseos-seq"
version = "0.0.0"
description = "pypulseq sequence backend for PulseOS"
requires-python = ">=3.11"
dependencies = [
    "pypulseq>=1.5.0,<1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulseos_seq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
